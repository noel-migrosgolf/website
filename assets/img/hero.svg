      <rect x="520" y="192" width="128" height="128" rx="12" fill="#FFFFFF" stroke="#DDDEE1" stroke-width="2"/>
      <circle cx="584" cy="248" r="34" fill="none" stroke="#DCDFE4" stroke-width="12"/>
      <path d="M584 214a34 34 0 0 1 30 50" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>

      <rect x="232" y="352" width="416" height="10" rx="5" fill="#DCDFE4"/>
      <rect x="232" y="376" width="356" height="10" rx="5" fill="#DCDFE4"/>

      <!-- Kommentar-Karte -->
      <g transform="translate(232 412)">
        <rect x="0" y="0" width="416" height="56" rx="10" fill="#FFFFFF" stroke="#DDDEE1" stroke-width="2"/>
        <circle cx="30" cy="28" r="14" fill="url(#accent)"/>
        <rect x="56" y="18" width="96"  height="8" rx="4" fill="#8590A2"/>
        <rect x="56" y="34" width="180" height="8" rx="4" fill="#DCDFE4"/>
      </g>

      <!-- Anwesende -->
      <g transform="translate(700 16)">
        <circle cx="16" cy="10" r="12" fill="#1868DB"/>
        <circle cx="42" cy="10" r="12" fill="#BF63F3"/>
        <circle cx="68" cy="10" r="12" fill="#FF9F1A"/>
      </g>
    </g>
  </g>
