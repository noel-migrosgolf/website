<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Platzhalter: Zusammenfassung als Kurzbriefing zum Anhören">
  <defs>
    <pattern id="f4-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#D6C6F7"/>
    </pattern>
    <filter id="f4-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#091E42" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="#F3EEFF"/>
  <rect width="600" height="600" fill="url(#f4-dots)"/>

  <!-- Briefing-Karte -->
  <g filter="url(#f4-shadow)">
    <rect x="110" y="96" width="380" height="400" rx="16" fill="#FFFFFF"/>
  </g>

  <!-- Kopfzeile der Karte -->
  <g fill="#B7B9BE">
    <circle cx="140" cy="128" r="3.4"/>
    <circle cx="152" cy="128" r="3.4"/>
    <circle cx="164" cy="128" r="3.4"/>
  </g>
  <path d="m446 122 12 12m0-12-12 12" fill="none" stroke="#626F86" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Kleines Diagramm als Sinnbild für den Bericht -->
  <rect x="248" y="168" width="44" height="36" rx="8" fill="#F1F2F4"/>
  <rect x="259" y="180" width="22" height="6" rx="3" fill="#8590A2"/>
  <rect x="259" y="190" width="14" height="6" rx="3" fill="#8590A2"/>
  <path d="M304 204l16-18 12 11 20-25" fill="none" stroke="#36B37E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M344 172h10v10" fill="none" stroke="#36B37E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Titel des Briefings -->
  <rect x="172" y="240" width="252" height="15" rx="7.5" fill="#101214" opacity=".8"/>
  <rect x="208" y="266" width="180" height="15" rx="7.5" fill="#101214" opacity=".8"/>

  <!-- Verfasserzeile -->
  <circle cx="232" cy="308" r="10" fill="#C1C7D0"/>
  <rect x="250" y="302" width="114" height="12" rx="6" fill="#DCDFE4"/>

  <!-- Aktionen -->
  <rect x="154" y="344" width="38" height="30" rx="8" fill="#F1F2F4"/>
  <rect x="165" y="355" width="16" height="8" rx="4" fill="#8590A2"/>
  <rect x="202" y="344" width="158" height="30" rx="15" fill="#F1F2F4"/>
  <rect x="220" y="354" width="122" height="10" rx="5" fill="#8590A2" opacity=".8"/>
  <rect x="370" y="344" width="38" height="30" rx="8" fill="#F1F2F4"/>
  <circle cx="389" cy="359" r="7" fill="none" stroke="#8590A2" stroke-width="3"/>

  <!-- Abspielen -->
  <circle cx="300" cy="414" r="28" fill="#1868DB"/>
  <path d="M292 402l17 12-17 12z" fill="#FFFFFF"/>

  <!-- Wiedergabeliste -->
  <rect x="138" y="452" width="324" height="34" rx="10" fill="#F7F8F9"/>
  <rect x="156" y="463" width="16" height="12" rx="3" fill="#8590A2"/>
  <rect x="184" y="465" width="86" height="9" rx="4.5" fill="#C1C7D0"/>
  <path d="m430 472 8-8 8 8" fill="none" stroke="#626F86" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
