<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Platzhalter: Eine Automation aus einer Vorlage starten">
  <defs>
    <linearGradient id="f1-brand" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#35A2F7"/>
      <stop offset="1" stop-color="#1585E8"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="#101214"/>

  <!-- Dokumentfenster, nach rechts unten aus dem Bild laufend -->
  <rect x="88" y="104" width="560" height="520" rx="16" fill="#FFFFFF"/>

  <!-- Kopfzeile: Symbol und Titel -->
  <rect x="124" y="144" width="32" height="32" rx="9" fill="url(#f1-brand)"/>
  <circle cx="140" cy="160" r="7" fill="#FFFFFF" opacity=".9"/>
  <rect x="170" y="151" width="200" height="18" rx="9" fill="#101214" opacity=".85"/>

  <!-- Zeile mit Autor und Kennzeichnung -->
  <circle cx="135" cy="208" r="11" fill="#C1C7D0"/>
  <rect x="156" y="202" width="118" height="12" rx="6" fill="#DCDFE4"/>
  <rect x="290" y="196" width="112" height="24" rx="12" fill="#FFF4E5" stroke="#F5CD47" stroke-width="2"/>
  <rect x="304" y="205" width="84" height="7" rx="3.5" fill="#A54800" opacity=".55"/>

  <!-- Abschnittsüberschrift -->
  <rect x="124" y="252" width="148" height="22" rx="11" fill="#101214" opacity=".85"/>

  <!-- Laufender Satz mit Schreibmarke und KI-Kennzeichen -->
  <rect x="124" y="304" width="176" height="14" rx="7" fill="#1868DB"/>
  <rect x="310" y="294" width="4" height="34" rx="2" fill="#101214"/>
  <rect x="318" y="266" width="78" height="26" rx="7" fill="#101214"/>
  <rect x="332" y="276" width="50" height="7" rx="3.5" fill="#FFFFFF" opacity=".85"/>

  <!-- Fließtext -->
  <g fill="#EBECF0">
    <rect x="124" y="352" width="420" height="13" rx="6.5"/>
    <rect x="124" y="388" width="384" height="13" rx="6.5"/>
    <rect x="124" y="424" width="446" height="13" rx="6.5"/>
    <rect x="124" y="460" width="296" height="13" rx="6.5"/>
    <rect x="124" y="496" width="408" height="13" rx="6.5"/>
    <rect x="124" y="532" width="340" height="13" rx="6.5"/>
  </g>
</svg>
