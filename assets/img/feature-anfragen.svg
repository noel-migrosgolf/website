    <g>
      <circle cx="104" cy="918" r="5"/><circle cx="128" cy="918" r="5"/><circle cx="152" cy="918" r="5"/><circle cx="176" cy="918" r="5"/>
      <circle cx="104" cy="942" r="5"/><circle cx="128" cy="942" r="5"/><circle cx="152" cy="942" r="5"/><circle cx="176" cy="942" r="5"/>
      <circle cx="104" cy="966" r="5"/><circle cx="128" cy="966" r="5"/><circle cx="152" cy="966" r="5"/><circle cx="176" cy="966" r="5"/>
    </g>
  </g>

  <path d="M655 258 701 272 672 307Z" fill="none" stroke="#F4514E" stroke-width="4" stroke-linejoin="round"/>
