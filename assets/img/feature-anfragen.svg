  <path d="M999.5 734.3A110 110 0 1 1 1131.4 665.6" fill="none" stroke="#1F1F1F" stroke-width="3" stroke-linecap="round"/>
  <circle cx="1028" cy="628" r="82" fill="#E3EAFD"/>
  <path d="M985 630l31 32 60-66" fill="none" stroke="#2F6BFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
