<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Platzhalter: Aus einer Idee wird eine laufende Aufgabe">
  <defs>
    <pattern id="f2-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#DCDFE4"/>
    </pattern>
    <filter id="f2-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#091E42" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="#EBECF0"/>

  <!-- Arbeitsfläche mit Punktraster -->
  <rect x="104" y="64" width="456" height="300" rx="14" fill="#FFFFFF"/>
  <rect x="128" y="88" width="408" height="252" fill="url(#f2-dots)"/>
  <rect x="470" y="64" width="90" height="118" fill="#E9DDFF"/>

  <!-- Aufgabenkarte, frei über der Fläche schwebend -->
  <g filter="url(#f2-shadow)">
    <rect x="64" y="258" width="404" height="142" rx="14" fill="#FFFFFF"/>
  </g>

  <rect x="88" y="288" width="22" height="22" rx="6" fill="#1868DB"/>
  <path d="m93.5 299 4.5 4.5 8-8.5" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="122" y="291" width="186" height="15" rx="7.5" fill="#101214" opacity=".8"/>
  <rect x="326" y="285" width="122" height="28" rx="14" fill="#E9F2FE" stroke="#B3D4FF" stroke-width="2"/>
  <rect x="342" y="295" width="74" height="8" rx="4" fill="#1868DB" opacity=".6"/>

  <circle cx="99" cy="339" r="11" fill="#C1C7D0"/>
  <rect x="122" y="333" width="214" height="12" rx="6" fill="#DCDFE4"/>

  <rect x="88" y="364" width="18" height="18" rx="5" fill="#1868DB"/>
  <rect x="116" y="369" width="72" height="10" rx="5" fill="#C1C7D0"/>

  <!-- Zeiger mit Namensschild -->
  <path d="M470 344v46l12-13h18z" fill="#101214"/>
  <rect x="492" y="376" width="104" height="32" rx="16" fill="#BF63F3"/>
  <rect x="510" y="387" width="68" height="10" rx="5" fill="#FFFFFF" opacity=".9"/>

  <!-- Grundformen als Gestaltungselement -->
  <rect x="104" y="436" width="112" height="112" fill="#101214"/>
  <path d="M216 476h52l-52 52z" fill="#BF63F3"/>
  <rect x="280" y="476" width="120" height="72" fill="#FFE2D6"/>
</svg>
